version: 2
updates:
  # Runtime + build dependencies. @actual-app/api must track the Actual
  # server version, so check daily.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # Node base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
